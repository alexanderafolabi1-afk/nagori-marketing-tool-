<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagori • Setpostgo • Image Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .nagori-text {
            font-family: 'Playfair Display', serif;
        }
        
        .setpostgo-text {
            font-family: 'Inter', system_ui, sans-serif;
            font-weight: 700;
            letter-spacing: -0.04em;
        }
        
        .square-preview {
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen">
    <div class="max-w-7xl mx-auto px-8 py-12">
        <!-- Header -->
        <div class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl tracking-tighter font-light">CREATOR STUDIO</h1>
                <p class="text-zinc-500 text-sm tracking-widest">DUAL BRAND ASSETS</p>
            </div>
            <div class="text-emerald-400 text-xs tracking-[2px]">STEP 01 • TEXT GRAPHICS</div>
        </div>

        <div class="flex gap-16">
            <!-- Controls -->
            <div class="w-96 flex-shrink-0">
                <!-- Brand Toggle -->
                <div class="mb-10">
                    <label class="block text-zinc-400 text-sm tracking-widest mb-3">BRAND</label>
                    <div class="flex bg-zinc-900 rounded-2xl p-1 w-fit">
                        <button id="nagoriBtn"
                                class="brand-btn active px-8 py-3 rounded-xl text-sm font-medium transition-all">
                            NAGORI
                        </button>
                        <button id="setpostgoBtn"
                                class="brand-btn px-8 py-3 rounded-xl text-sm font-medium transition-all">
                            SETPOSTGO
                        </button>
                    </div>
                </div>

                <!-- Generate Button -->
                <div class="mb-4">
                    <button id="generateBtn"
                            class="w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 hover:border-zinc-500 transition-all py-4 rounded-2xl text-sm tracking-widest flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894L18 21H6l-2.236-8.106A2 2 0 015.236 10H10" />
                        </svg>
                        GENERATE HIGH-CONVERSION TEXT
                    </button>
                </div>

                <div class="mb-8">
                    <label class="block text-zinc-400 text-sm tracking-widest mb-3">YOUR TEXT</label>
                    <textarea 
                        id="textInput" 
                        rows="6"
                        class="w-full bg-zinc-900 border border-zinc-700 focus:border-white/30 rounded-2xl px-6 py-5 text-lg resize-none focus:outline-none text-white placeholder-zinc-500"
                        placeholder="Type your message here..."></textarea>
                </div>

                <button 
                    id="downloadBtn"
                    class="w-full bg-white text-black hover:bg-white/90 transition-colors font-medium py-6 rounded-2xl text-lg tracking-wider flex items-center justify-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-4m0 0l4 4m-4-4l4-4m12 4v4m0-4l-4 4m4-4l-4-4" />
                    </svg>
                    DOWNLOAD IMAGE
                </button>

                <div class="mt-12 text-xs text-zinc-500 leading-relaxed">
                    <p class="mb-1">• Live preview updates instantly</p>
                    <p class="mb-1">• 1:1 square format</p>
                    <p>• Perfect for social media &amp; marketing</p>
                </div>
            </div>

            <!-- Preview -->
            <div class="flex-1 flex items-center justify-center">
                <div id="preview" 
                     class="square-preview w-[440px] h-[440px] bg-[#121212] rounded-3xl overflow-hidden relative flex items-center justify-center border border-zinc-800">
                    
                    <!-- Content -->
                    <div class="text-center px-12 max-w-[85%]">
                        <div id="previewText" 
                             class="nagori-text text-4xl leading-tight text-white tracking-[-1px]">
                            The quiet pursuit of excellence
                        </div>
                    </div>

                    <!-- Watermark -->
                    <div id="watermark" class="absolute bottom-8 left-1/2 -translate-x-1/2">
                        <div class="flex items-center gap-2 text-[10px] tracking-[3px] text-zinc-500 font-light">
                            <div class="w-6 h-px bg-zinc-700"></div>
                            <span id="watermarkText">NAGORI</span>
                            <div class="w-6 h-px bg-zinc-700"></div>
                        </div>
                    </div>

                    <!-- Subtle border accent -->
                    <div class="absolute inset-0 border border-white/10 rounded-3xl pointer-events-none"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const previewText = document.getElementById('previewText');
        const preview = document.getElementById('preview');
        const watermarkText = document.getElementById('watermarkText');
        const downloadBtn = document.getElementById('downloadBtn');
        const nagoriBtn = document.getElementById('nagoriBtn');
        const setpostgoBtn = document.getElementById('setpostgoBtn');
        const generateBtn = document.getElementById('generateBtn');

        let currentBrand = 'nagori';

        // Nagori Philosophical Texts
        const nagoriTexts = [
            "Digital noise fades. True legacy requires a permanent archive.",
            "What is written on water disappears. What is archived stays forever.",
            "In the age of fleeting attention, permanence is the ultimate luxury.",
            "Time erases the ordinary. Only the carefully preserved endures.",
            "Build not for the moment, but for the centuries that follow.",
            "Your story deserves more than temporary pixels.",
            "Legacy is not left by chance — it is deliberately preserved."
        ];

        // Setpostgo Growth Texts
        const setpostgoTexts = [
            "The 3-second hook rule: If you don't stop the scroll immediately, your content doesn't exist.",
            "Stop posting manually. The top 1% of creators automate their distribution channels.",
            "Post once. Reach everywhere. This is how the new elite build empires.",
            "Your content is worthless if no one sees it. Distribution is the real game.",
            "Consistency beats talent when systems do the heavy lifting.",
            "Automate the boring. Dominate the feed.",
            "Most creators post. Winners engineer visibility."
        ];

        function switchBrand(brand) {
            currentBrand = brand;
            
            if (brand === 'nagori') {
                nagoriBtn.classList.add('active', 'bg-white', 'text-black');
                setpostgoBtn.classList.remove('active', 'bg-white', 'text-black');
                
                preview.style.backgroundColor = '#121212';
                previewText.classList.remove('setpostgo-text');
                previewText.classList.add('nagori-text');
                watermarkText.textContent = 'NAGORI';
                previewText.style.fontSize = '2.25rem';
            } else {
                nagoriBtn.classList.remove('active', 'bg-white', 'text-black');
                setpostgoBtn.classList.add('active', 'bg-white', 'text-black');
                
                preview.style.background = 'linear-gradient(145deg, #0a0a0a, #111111)';
                previewText.classList.remove('nagori-text');
                previewText.classList.add('setpostgo-text');
                watermarkText.textContent = 'SETPOSTGO.XYZ';
                previewText.style.fontSize = '2.1rem';
            }
        }

        function generateText() {
            let texts = currentBrand === 'nagori' ? nagoriTexts : setpostgoTexts;
            const randomIndex = Math.floor(Math.random() * texts.length);
            const selectedText = texts[randomIndex];
            
            textInput.value = selectedText;
            previewText.textContent = selectedText;
        }

        // Brand button listeners
        nagoriBtn.addEventListener('click', () => switchBrand('nagori'));
        setpostgoBtn.addEventListener('click', () => switchBrand('setpostgo'));

        // Generate button
        generateBtn.addEventListener('click', generateText);

        // Live text update
        textInput.addEventListener('input', () => {
            const text = textInput.value.trim();
            previewText.textContent = text === '' ? 'Your message appears here' : text;
        });

        // Download functionality
        downloadBtn.addEventListener('click', () => {
            downloadBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                </svg>
                GENERATING...
            `;
            downloadBtn.disabled = true;

            html2canvas(preview, {
                scale: 2,
                useCORS: true,
                backgroundColor: currentBrand === 'nagori' ? '#121212' : '#0a0a0a'
            }).then(canvas => {
                const link = document.createElement('a');
                const brandPrefix = currentBrand === 'nagori' ? 'nagori' : 'setpostgo';
                link.download = `${brandPrefix}-${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                setTimeout(() => {
                    downloadBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-4m0 0l4 4m-4-4l4-4m12 4v4m0-4l-4 4m4-4l-4-4" />
                        </svg>
                        DOWNLOAD IMAGE
                    `;
                    downloadBtn.disabled = false;
                }, 700);
            }).catch(err => {
                console.error(err);
                alert("Failed to generate image. Please try again.");
                downloadBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-4m0 0l4 4m-4-4l4-4m12 4v4m0-4l-4 4m4-4l-4-4" />
                    </svg>
                    DOWNLOAD IMAGE
                `;
                downloadBtn.disabled = false;
            });
        });

        // Initialize
        window.onload = () => {
            textInput.value = "The quiet pursuit of excellence";
            previewText.textContent = "The quiet pursuit of excellence";
            switchBrand('nagori');
        };
    </script>
</body>
</html>
